services:
  mradio-server:
    image: mradio-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mradio-server
    restart: always
    ports:
      - "${APP_PORT:-9126}:9126"
    environment:
      - NODE_ENV=production
      - FFMPEG_ENV=production
      - TZ=${TZ:-Asia/Kolkata}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - X_ADMIN_API_KEY=${X_ADMIN_API_KEY:?X_ADMIN_API_KEY is required}
      - X_ADMIN_TOKEN_KEY=${X_ADMIN_TOKEN_KEY:?X_ADMIN_TOKEN_KEY is required}
      - SPOTIFY_CLIEND_ID=${SPOTIFY_CLIEND_ID:-}
      - SPOTIFY_CLIEND_SECRET_ID=${SPOTIFY_CLIEND_SECRET_ID:-}
      - SOUNDCLOUD_API_KEY=${SOUNDCLOUD_API_KEY:-}
      - INITIAL_PLAYLIST_ID=${INITIAL_PLAYLIST_ID:-}
      - INITIAL_PLAYLIST_SOURCE=${INITIAL_PLAYLIST_SOURCE:-}
      - INITIAL_PLAYLIST_TITLE=${INITIAL_PLAYLIST_TITLE:-}
      - ICECAST_HOST=${ICECAST_HOST:-}
      - ICECAST_PORT=${ICECAST_PORT:-}
      - ICECAST_PASSWORD=${ICECAST_PASSWORD:-}
      - ICECAST_BITRATE=${ICECAST_BITRATE:-128}
    volumes:
      - /data/mradio/data:/usr/src/app/data
      - /data/mradio/cache:/usr/src/app/cache
      - /data/mradio/media:/usr/src/app/media
      - /data/mradio/logs:/usr/src/app/logs
      - /data/mradio/config:/usr/src/app/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:9126/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
